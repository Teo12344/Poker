<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0b0e">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Home Game">
<meta name="description" content="Texas Hold'em with friends — share a link and play">
<title>Home Game · Texas Hold'em</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- ============ HOME ============ -->
<section class="home" id="home">
  <div class="home-top">
    <div class="brand"><i>♠</i>Home Game</div>
    <button class="langbtn" data-lang-toggle></button>
  </div>
  <div class="home-main">
    <div class="hero">
      <div class="hero-cards" id="heroCards"></div>
      <h1>Home Game</h1>
      <p class="tag" data-i18n="tagline"></p>
      <p class="sub" data-i18n="homeSub"></p>
    </div>

    <form class="hcard" id="homeForm" autocomplete="off">
      <div class="invite-info hide" id="inviteInfo">
        <div class="ii-label" data-i18n="invitedTo"></div>
        <div class="ii-room" id="iiRoom"></div>
        <div class="ii-players" id="iiPlayers"></div>
      </div>
      <button type="button" class="resume hide" id="resumeBtn"></button>

      <label data-i18n="nickname"></label>
      <input id="nameIn" maxlength="12" data-i18n-ph="nickPh" enterkeyhint="go">

      <div id="createBlock">
        <button class="bigbtn" type="button" id="createBtn" data-i18n="createGame"></button>
        <div class="divider"><span data-i18n="or"></span></div>
        <div class="coderow">
          <input id="codeIn" maxlength="20" data-i18n-ph="codePh" autocapitalize="characters" spellcheck="false">
          <button class="midbtn" type="button" id="joinCodeBtn" data-i18n="joinCode"></button>
        </div>
      </div>

      <div id="inviteBlock" class="hide">
        <button class="bigbtn" type="submit" id="joinInviteBtn" data-i18n="joinTable"></button>
        <div class="linkrow">
          <button type="button" class="ghost" id="watchBtn" data-i18n="watch"></button>
          <button type="button" class="ghost" id="otherBtn" data-i18n="otherTable"></button>
        </div>
      </div>
    </form>

    <p class="ioshint hide" id="iosHint" data-i18n-html="iosHint"></p>
    <p class="rules" data-i18n="rules"></p>
  </div>
</section>

<!-- ============ GAME ============ -->
<section class="game hide" id="game">
  <header class="topbar">
    <button class="tbtn icon" id="homeBtn" data-i18n-title="home">‹</button>
    <div class="brand"><i>♠</i><span class="opt2">Home Game</span></div>
    <span class="conn" id="conn"></span>
    <span class="pill"><span data-i18n="room"></span> <b id="roomName"></b></span>
    <span class="pill opt"><span data-i18n="blinds"></span> <b id="blinds"></b></span>
    <span class="pill opt"><span data-i18n="hand"></span> <b id="handNo">-</b></span>
    <div class="spacer"></div>
    <button class="tbtn" id="inviteBtn" data-i18n="invite"></button>
    <button class="tbtn primary hide" id="startBtn" data-i18n="start"></button>
    <button class="tbtn hide" id="rebuyBtn"></button>
    <button class="tbtn hide" id="sitBtn"></button>
    <button class="tbtn langbtn" data-lang-toggle></button>
    <button class="tbtn icon hide" id="fsBtn" data-i18n-title="fullscreen">⛶</button>
    <button class="tbtn" id="leaveBtn" data-i18n="leave"></button>
  </header>

  <main class="stage">
    <div class="table" id="table">
      <div class="rail"></div><div class="wood"></div>
      <div class="felt"><div class="betline"></div><div class="logo">HOME GAME · HOLD'EM</div></div>
      <div class="center">
        <div class="potbox"><div class="chipstack hide" id="potChips"></div><div class="potlabel hide" id="pot"></div></div>
        <div class="board" id="board"></div>
        <div class="tmsg" id="tmsg"></div>
      </div>
      <div id="layer"></div>
    </div>
  </main>

  <aside class="panel eq" id="eq">
    <h4><span data-i18n="myEq"></span><span id="eqOpp"></span></h4>
    <div id="eqBody"></div>
  </aside>

  <aside class="panel act waiting" id="act">
    <div class="raisebox hide" id="raiseBox">
      <div class="presets">
        <button data-p="min" data-i18n="pMin"></button><button data-p="half" data-i18n="pHalf"></button><button data-p="3q" data-i18n="p3q"></button><button data-p="pot" data-i18n="pPot"></button><button data-p="allin" data-i18n="pAllin"></button>
      </div>
      <div class="rrow"><button class="step" id="minusBtn" type="button">−</button><input type="range" id="slider" min="0" max="1" step="1"><button class="step" id="plusBtn" type="button">+</button><input class="ramt" id="ramt" type="number" inputmode="numeric"></div>
      <div class="rangehint" id="rangeHint"></div>
    </div>
    <div class="brow">
      <button class="btn fold" id="foldBtn" disabled></button>
      <button class="btn call" id="callBtn" disabled></button>
      <button class="btn raise" id="raiseBtn" disabled></button>
    </div>
    <div class="actnote" id="actNote"></div>
  </aside>

  <aside class="panel logp collapsed" id="logp">
    <header id="logHead"><span data-i18n="log"></span><span id="logToggle"></span></header>
    <ul id="log"></ul>
  </aside>

  <div class="rotate"><span>📱</span><b data-i18n="rotate"></b><small data-i18n="rotateSub"></small></div>
</section>

<div class="toast" id="toast"></div>

<script src="/eval.js"></script>
<script src="/i18n.js"></script>
<script src="/app.js"></script>
</body>
</html>
