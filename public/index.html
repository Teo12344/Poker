<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Home Game · 텍사스 홀덤</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%99%A0%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><i>♠</i>Home Game</div>
  <span class="conn" id="conn" title="서버 연결"></span>
  <span class="pill">방 <b id="roomName">main</b></span>
  <span class="pill opt">블라인드 <b id="blinds">$250 / $500</b></span>
  <span class="pill opt">핸드 <b id="handNo">-</b></span>
  <div class="spacer"></div>
  <button class="tbtn" id="inviteBtn">초대 링크 복사</button>
  <button class="tbtn primary hide" id="startBtn">게임 시작</button>
  <button class="tbtn hide" id="rebuyBtn">$50,000 다시 받기</button>
  <button class="tbtn hide" id="sitBtn">자리 비우기</button>
  <button class="tbtn hide" id="leaveBtn">나가기</button>
</header>

<main class="stage">
  <div class="table" id="table">
    <div class="rail"></div><div class="wood"></div>
    <div class="felt"><div class="betline"></div><div class="logo">HOME GAME · HOLD'EM</div></div>
    <div class="center">
      <div class="potbox"><div class="chipstack hide" id="potChips"></div><div class="potlabel hide" id="pot">팟 <span>$0</span></div></div>
      <div class="board" id="board"></div>
      <div class="tmsg" id="tmsg"></div>
    </div>
    <div id="layer"></div>
  </div>
</main>

<aside class="panel eq" id="eq">
  <h4><span>내 승률</span><span id="eqOpp"></span></h4>
  <div id="eqBody"><div class="eqidle">핸드가 시작되면 표시됩니다</div></div>
</aside>

<aside class="panel act waiting" id="act">
  <div class="raisebox" id="raiseBox">
    <div class="presets">
      <button data-p="min">최소</button><button data-p="half">½ 팟</button><button data-p="3q">¾ 팟</button><button data-p="pot">팟</button><button data-p="allin">올인</button>
    </div>
    <div class="rrow"><input type="range" id="slider" min="0" max="1" step="1"><input class="ramt" id="ramt" type="number" inputmode="numeric"></div>
  </div>
  <div class="brow">
    <button class="btn fold" id="foldBtn" disabled>폴드<kbd>F</kbd></button>
    <button class="btn call" id="callBtn" disabled>체크<kbd>C</kbd></button>
    <button class="btn raise" id="raiseBtn" disabled>레이즈<kbd>R</kbd></button>
  </div>
  <div class="actnote" id="actNote"></div>
</aside>

<aside class="panel logp collapsed" id="logp">
  <header id="logHead"><span>핸드 기록</span><span id="logToggle">펼치기 ▾</span></header>
  <ul id="log"></ul>
</aside>

<div class="overlay hide" id="overlay">
  <form class="joinbox" id="joinForm">
    <h2>♠ 테이블에 앉기</h2>
    <p>모두 <b>$50,000</b>으로 시작합니다. 최대 6명까지 앉을 수 있어요. 같은 방 이름을 쓰면 같은 테이블에 앉게 됩니다.</p>
    <label>닉네임</label>
    <input id="nameIn" maxlength="12" placeholder="예: 민수" autocomplete="off" required>
    <label>방 이름</label>
    <input id="roomIn" maxlength="20" placeholder="main" autocomplete="off">
    <button class="tbtn primary" type="submit">입장하기</button>
    <button class="ghost" type="button" id="watchBtn">구경만 하기</button>
  </form>
</div>
<div class="rotate" id="rotate"><span>📱</span>휴대폰을 가로로 돌려주세요<small>포커 테이블은 가로 화면에서 제대로 보여요</small></div>
<div class="toast" id="toast"></div>

<script src="/eval.js"></script>
<script src="/app.js"></script>
</body>
</html>
